version: '3.8'

services:
  app:
    build:
      context: . # Build context is now the project root
      dockerfile: Dockerfile # Explicitly specify the Dockerfile name if it's standard
    ports:
      - "3001:3001" # Exposes port 3001 on the host to port 3001 on the container
    volumes:
      # For backend development, mount only the backend code.
      # The frontend is built into the image; for frontend live-reloading,
      # you'd run the frontend dev server separately.
      - ./backend:/usr/src/app
      # Note: node_modules inside the container for the backend should not be overwritten
      # by a host volume if they were installed during the image build.
      # The Dockerfile already copies backend and installs dependencies.
      # This volume mount will overlay the app code, but node_modules from build will be used.
      # For production, you generally don't mount source code volumes.
      - /usr/src/app/node_modules # Keeps container's node_modules for backend
      # We no longer need to mount /usr/src/app/public as it's built into the image.
    depends_on:
      db:
        condition: service_healthy # Wait for db to be healthy
    environment:
      MYSQL_HOST: db
      MYSQL_USER: user # Replace with your desired user
      MYSQL_PASSWORD: password # Replace with your desired password
      MYSQL_DATABASE: blackjack_db # Replace with your desired database name
      NODE_ENV: development
    restart: unless-stopped

  db:
    image: mysql:8.0-debian # Using a specific MySQL version
    ports:
      - "3307:3306" # Exposes MySQL default port on host 3307, container port 3306
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword # Replace with a strong root password
      MYSQL_DATABASE: blackjack_db # Same as above
      MYSQL_USER: user # Same as above
      MYSQL_PASSWORD: password # Same as above
    volumes:
      - mysql_data:/var/lib/mysql # Persists database data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Give MySQL time to initialize before first health check

volumes:
  mysql_data: # Defines the named volume for data persistence
